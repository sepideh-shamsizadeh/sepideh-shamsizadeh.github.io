# Site settings for sepideh-shamsizadeh.github.io
# Jekyll does not reload this file automatically: restart `jekyll serve` after editing.

# ---------------------------------------------------------------- site
locale          : "en-US"
title           : "Sepideh Shamsizadeh"
title_separator : "-"
name            : "Sepideh Shamsizadeh"
description     : "Physical AI and robotics engineer in Zurich: robot perception, multimodal sensor fusion and edge AI."
url             : https://sepideh-shamsizadeh.github.io
migration_target: https://sepideh.io
playground_url  : https://playground.sepideh.io
baseurl         : ""
repository      : "sepideh-shamsizadeh/sepideh-shamsizadeh.github.io"
og_image        : "sepideh-shamsizadeh.jpg"   # link-preview image, in /images/
words_per_minute: 160
future          : true

# ---------------------------------------------------------------- author
author:
  name          : "Sepideh Shamsizadeh"
  avatar        : "sepideh-shamsizadeh.jpg"
  bio           : "Physical AI & Robotics Engineer"
  location      : "Zurich, Switzerland"
  github        : "sepideh-shamsizadeh"
  linkedin      : "sepideh-shamsizadeh"
  googlescholar : "https://scholar.google.com/citations?hl=en&user=Ksh-JpQAAAAJ"
  orcid         : "https://orcid.org/0000-0002-5560-945X"
  medium        : "https://medium.com/@sepideh.92sh"

# ---------------------------------------------------------------- services
analytics:
  provider      : false   # set to "google" and add a tracking_id to enable
  google:
    tracking_id :

# ---------------------------------------------------------------- build
include:
  - _pages
  - files
exclude:
  - blog/robotics/_posts/2026-11-24-designing_self-driving_car.md
  - .vercel
  - scripts
  - backend
  - _config.vercel.yml
  - _config.preview.yml
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs
  - tests
  - vendor
  - node_modules
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Blog posts. Posts with `medium_url` show as cards on /year-archive/ and
# their own URL redirects to Medium (front matter `redirect_to`).
permalink: /:categories/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single

sass:
  sass_dir: _sass
  style: compressed

timezone: Europe/Zurich

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Minify HTML (skipped in development)
compress_html:
  clippings: all
  ignore:
    envs: development
