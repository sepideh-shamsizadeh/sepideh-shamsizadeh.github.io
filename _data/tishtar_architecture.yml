blocks:
  - id: pc
    title: Development PC
    subtitle: Ubuntu · ROS 2 Jazzy
    description: Intended development, simulation and visualization workstation. End-to-end ROS 2 communication has not yet been verified.
    milestones: [environments, stm-ros]
  - id: pi
    title: Raspberry Pi 4B
    subtitle: Onboard computing
    description: Camera capture and servo bench tests are builder-reported. ROS 2 sensor interfaces, perception, localization and planning are integration targets.
    milestones: [camera-capture, pan-ros, camera-ros, pose, planning]
  - id: stm
    title: STM32 NUCLEO-F446RE
    subtitle: Low-level control
    description: Motor PWM has been tested according to the builder. Encoder feedback, four-wheel operation and closed-loop speed regulation remain planned.
    milestones: [motor-pwm, four-motors, encoder-feedback, closed-loop]
  - id: sensors
    title: Sensor suite
    subtitle: Observe the world
    description: Raspberry Pi Camera v2.1 / IMX219, TF Mini single-point LiDAR, ICM-20948 IMU, JSN-SR04T ultrasonic sensor and wheel encoders. Only camera capture is reported as tested. A single-point LiDAR does not by itself provide a 2D SLAM scan.
    milestones: [camera-capture, lidar, imu, ultrasonic, encoders]
  - id: servo
    title: PCA9685
    subtitle: Camera positioning
    description: I2C address 0x40, pan channel 1 and tilt channel 0 are builder-reported bench results. Exact installed servo models need confirmation; architecture notes list two MG90S servos for experiments separately from the pan-tilt assembly.
    milestones: [pca9685, pan-tilt, limits, pan-ros]
  - id: actuators
    title: Actuators
    subtitle: Turn commands into movement
    description: Target drivetrain comprises four DC motors and two L298N drivers. The camera mechanism has two servos; two MG90S servos are also listed as available experimental hardware. Full drivetrain integration is unverified.
    milestones: [four-motors, power, pan-tilt]
connections:
  - from: Development PC
    to: Raspberry Pi
    label: ROS 2 network · planned integration
    status: planned
  - from: Raspberry Pi
    to: STM32
    label: Serial interface · planned; message protocol undecided
    status: planned
  - from: Camera
    to: Raspberry Pi
    label: Image capture · builder-tested
    status: tested
  - from: Raspberry Pi
    to: PCA9685 → camera servos
    label: I2C + PWM · builder-tested
    status: tested
  - from: STM32
    to: Motor test
    label: PWM control · builder-tested; four-wheel validation pending
    status: tested
  - from: Remaining sensors
    to: Processing / feedback
    label: Integration planned; see architecture notes for proposed interfaces
    status: planned
