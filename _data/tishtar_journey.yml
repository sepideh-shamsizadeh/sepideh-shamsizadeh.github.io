# Public storytelling layer. Status is derived from the detailed roadmap, not set here.
- id: foundation
  title: A first spark of movement
  description: Establish the electronics and low-level motor control that everything else will depend on. Repository setup and a first STM32 motor-control test are verified; the complete four-wheel drivetrain is still ahead.
  road_position: 0.08
  issue_url: https://github.com/sepideh-shamsizadeh/tishtar-robot/issues/1
- id: camera
  title: Giving TISHTAR a gaze
  description: Bring the camera to life and direct its view with a pan-tilt mechanism. Image capture and standalone Python servo control have been builder-tested. Calibrated limits and ROS 2 integration remain to be completed.
  road_position: 0.22
  issue_url: https://github.com/sepideh-shamsizadeh/tishtar-robot/issues/3
- id: motion
  title: From commands to controlled motion
  description: Connect high-level ROS 2 commands to the STM32, then use encoder feedback to make movement measurable and repeatable. Architecture work is underway; closed-loop motion is not yet verified.
  road_position: 0.36
  issue_url: https://github.com/sepideh-shamsizadeh/tishtar-robot/issues/2
- id: perception
  title: Sensing the surroundings
  description: Bring camera, range, motion and wheel measurements into one perception system. The planned sensors include TF Mini LiDAR, an IMU, ultrasonic sensing and wheel encoders.
  road_position: 0.5
- id: mapping
  title: Knowing where it is
  description: Develop coordinate frames, pose estimation and mapping, then evaluate how reliably the robot can localize itself. This is a planned capability.
  road_position: 0.64
- id: navigation
  title: Finding its own way
  description: Combine planning, obstacle avoidance and goal-based movement into an autonomous navigation system. Real-world navigation remains a future integration goal.
  road_position: 0.78
- id: intelligence
  title: Looking beyond navigation
  description: Explore active perception, semantic understanding and learned decision making. These are research directions, including possible world-model experiments, rather than implemented capabilities.
  road_position: 0.92
