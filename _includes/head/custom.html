{% include base_path %}

<!-- start custom head snippets -->

<meta name="color-scheme" content="light dark">
<script>
  /* Apply the theme before first paint. Dark by default; the toggle saves "light" or "dark". */
  (function () { var t = "dark"; try { var s = localStorage.getItem("theme"); if (s === "dark" || s === "light") t = s; } catch (e) {} document.documentElement.setAttribute("data-theme", t); })();
</script>

<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="{{ base_path }}/assets/css/site.css">

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->

{% if page.layout == 'tishtar' %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/tishtar.css">
<meta name="description" content="{{ page.excerpt | strip_html | escape }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | escape }}">
<meta name="twitter:description" content="{{ page.excerpt | strip_html | escape }}">
{% endif %}

{% if page.layout == 'technical-article' %}
<link rel="stylesheet" href="{{ '/assets/css/technical-article.css' | relative_url }}">
<script src="{{ '/assets/js/technical-article.js' | relative_url }}" defer></script>
{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/navigation.css' | relative_url }}">
<script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
{% if page.project_publication_styles %}
<link rel="stylesheet" href="{{ '/assets/css/project-publication.css' | relative_url }}">
{% endif %}
