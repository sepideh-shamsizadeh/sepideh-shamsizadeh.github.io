{% assign checkpoint = site.data.tishtar_roadmap.milestones | where: 'id', site.data.tishtar_roadmap.road_current_milestone_id | first %}
<script type="application/json" id="tr-drive-data">
{"road_current_milestone_id":{{ checkpoint.phase | jsonify }},"checkpoint_title":{{ checkpoint.title | jsonify }},"statuses":{{ site.data.tishtar_roadmap.statuses | jsonify }},"phases":{{ site.data.tishtar_roadmap.phases | jsonify }},"milestones":[
{% for stage in site.data.tishtar_journey %}{% include tishtar-stage-status.html id=stage.id %}
{"id":{{ stage.id | jsonify }},"title":{{ stage.title | jsonify | replace: '<', '\u003c' }},"phase":{{ stage.id | jsonify }},"description":{{ stage.description | jsonify | replace: '<', '\u003c' }},"road_position":{{ stage.road_position }},"status":{{ stage_status | jsonify }},"verified_checkpoint":{% if checkpoint.phase == stage.id and checkpoint.status == 'completed' %}true{% else %}false{% endif %}}{% unless forloop.last %},{% endunless %}
{% endfor %}]}
</script>
