{% include base_path %}
{% if page.previous or page.next %}
  <nav class="post-nav" aria-label="More posts">
    {% if page.previous %}
      <a class="post-nav__prev" href="{{ base_path }}{{ page.previous.url }}"><span>← Previous</span>{{ page.previous.title | markdownify | strip_html | strip }}</a>
    {% endif %}
    {% if page.next %}
      <a class="post-nav__next" href="{{ base_path }}{{ page.next.url }}"><span>Next →</span>{{ page.next.title | markdownify | strip_html | strip }}</a>
    {% endif %}
  </nav>
{% endif %}
